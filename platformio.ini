; Clara v3 firmware - PlatformIO project (https://platformio.org)
;
;   pio run -e mainboard -t upload     build + flash the main board (Arduino Mega 2560)
;   pio run -e dosing -t upload        build + flash the dosing board (Arduino Uno)
;   pio test -e native                 run all unit and integration tests on the PC
;   pio device monitor                 serial console (9600 baud)
;
; The code is plain C++11 (the Arduino default), so no -std flag is needed.
; See README.md for details.

[platformio]
default_envs = mainboard, dosing

[env]
lib_ldf_mode = deep+
monitor_speed = 9600
monitor_echo = yes
monitor_filters = send_on_enter

[env:mainboard]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_src_filter = +<mainboard/>
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
; Uncomment once you know the board's bootloader survives watchdog resets:
; build_flags = -DCLARA_ENABLE_WATCHDOG

[env:dosing]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<dosing/>

; Host build: runs the hardware-independent libraries in test/ on the PC.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -Wall -Wextra -g -DUNITY_INCLUDE_DOUBLE
lib_ignore = LiquidCrystal_I2C
