name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Unit + integration tests (g++, sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  platformio:
    name: PlatformIO build + native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
      - run: pio run -e mainboard -e dosing
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/mainboard/firmware.hex
            .pio/build/dosing/firmware.hex

  firmware-in-the-loop:
    name: Dosing firmware in simavr
    needs: platformio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y simavr libsimavr-dev libelf-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio && pio run -e dosing
      - run: test/simavr/run_dosing_sim.sh .pio/build/dosing/firmware.elf
